[tool.poetry]
name = "causal-ddi-agent"
version = "0.1.0"
description = "Causal inference agent for discovering drug-drug interaction adverse effects using FAERS data"
authors = ["Anais Chossegros"]
readme = "README.md"
packages = [{include = "causal_ddi_agent.py"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.10.0"
requests = "^2.31.0"
scikit-learn = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"